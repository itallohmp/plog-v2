# Configuração de referência do nginx para o PLOG.
#
# O nginx serve os estáticos direto de /home/plog-v2/static e faz proxy de
# /api/ para o uvicorn (127.0.0.1:8000). Este arquivo documenta a config de
# performance (gzip + cache); a fonte de verdade em produção é
# /etc/nginx/sites-available/<arquivo>. Após editar lá:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cache: HTML sempre revalida (no-cache); CSS/JS/fontes têm cache longo e
# imutável. Como os nomes são fixos, style.css/script.js são versionados no
# HTML por ?v=N — bump o N a cada deploy que mude esses arquivos. As fontes
# (.woff2) são estáveis e não precisam de versionamento.

server {
    listen 80;
    server_name 10.10.10.208;

    root /home/plog-v2/static;
    index index.html;

    # ---- Compressão ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # text/html o nginx já comprime; woff2 já é comprimido (não incluir).

    # ---- HTML: sempre revalida (nunca prende uma tela velha) ----
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # ---- CSS/JS/fontes/imagens: cache longo e imutável ----
    location ~* \.(?:css|js|woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API FastAPI ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/plog-access.log;
    error_log  /var/log/nginx/plog-error.log;
}
