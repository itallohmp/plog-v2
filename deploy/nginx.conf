# Configuração de referência do nginx para o PLOG.
#
# O nginx serve os estáticos direto de /home/plog-v2/static e faz proxy de
# /api/ para o uvicorn (127.0.0.1:8000). Este arquivo documenta a config de
# performance (gzip + cache); a fonte de verdade em produção é
# /etc/nginx/sites-available/<arquivo>. Após editar lá:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cache: HTML sempre revalida (no-cache). Fontes e imagens (estáveis) têm cache
# longo. CSS/JS revalidam a cada 1h — assim um deploy é pego sozinho em até 1h,
# sem precisar versionar (?v=N). O ?v ainda pode ser usado para forçar
# atualização instantânea de um hotfix, mas não é mais obrigatório a cada deploy.

server {
    listen 80;
    server_name 10.10.10.208;

    root /home/plog-v2/static;
    index index.html;

    # ---- Compressão ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # text/html o nginx já comprime; woff2 já é comprimido (não incluir).

    # ---- HTML: sempre revalida (nunca prende uma tela velha) ----
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # ---- Fontes e imagens: estáveis, cache longo ----
    location ~* \.(?:woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- CSS/JS: revalida em 1h (deploy pego sozinho, sem versionar) ----
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API FastAPI ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/plog-access.log;
    error_log  /var/log/nginx/plog-error.log;
}
