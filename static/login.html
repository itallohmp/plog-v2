<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#040d1f">
    <title>PLog — Login</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/style.css?v=11">
</head>
<body class="body_login">
    <header class="topbar">
        <a href="/" class="brand" aria-label="PLog — início">
            <img src="/img/logo-mark.svg" alt="" class="brand__mark" width="32" height="36">
            <span class="brand__name">PLOG</span>
        </a>
        <nav class="topbar__nav">
            <a href="/index.html" class="text_link">← Voltar ao início</a>
        </nav>
    </header>

    <main class="login_layout">
        <section class="login_intro" aria-hidden="true">
            <p class="eyebrow">Console NOC</p>
            <h2 class="login_intro__title">Do IP público ao assinante,<br>em uma consulta.</h2>

            <!-- Topologia ilustrativa: assinantes → CGNAT → IP público. -->
            <svg class="topology" viewBox="0 0 620 380" fill="none">
                <text class="topology__caption" x="0" y="12">ASSINANTES · 100.64.0.0/10</text>
                <text class="topology__caption" x="620" y="12" text-anchor="end">IP PÚBLICO</text>
                <g class="topology__links">
                    <path d="M144 60C228 60 190 200 284 200"/>
                    <path d="M144 200C228 200 190 200 284 200"/>
                    <path d="M144 270C228 270 190 200 284 200"/>
                    <path d="M144 340C228 340 190 200 284 200"/>
                    <path d="M376 200C470 200 450 270 568 270"/>
                </g>
                <path class="topology__hot" d="M144 130C228 130 190 200 284 200"/>
                <path class="topology__hot" d="M376 200C470 200 450 130 568 130"/>
                <g class="topology__nodes">
                    <rect x="10" y="50" width="20" height="20" rx="4"/>
                    <rect x="10" y="190" width="20" height="20" rx="4"/>
                    <rect x="10" y="260" width="20" height="20" rx="4"/>
                    <rect x="10" y="330" width="20" height="20" rx="4"/>
                    <circle cx="580" cy="270" r="11"/>
                </g>
                <rect class="topology__node-hot" x="10" y="120" width="20" height="20" rx="4"/>
                <circle class="topology__node-hot" cx="580" cy="130" r="11"/>
                <circle class="topology__dot-hot" cx="580" cy="130" r="4"/>
                <circle class="topology__dot" cx="580" cy="270" r="4"/>
                <rect class="topology__halo" x="276" y="158" width="108" height="84" rx="16"/>
                <rect class="topology__core" x="284" y="166" width="92" height="68" rx="12"/>
                <text class="topology__core-label" x="330" y="197" text-anchor="middle">CGNAT</text>
                <text class="topology__core-sub" x="330" y="215" text-anchor="middle">172.16.2.1</text>
                <g class="topology__labels">
                    <text x="42" y="64">100.64.7.223</text>
                    <text x="42" y="204">100.64.22.47</text>
                    <text x="42" y="274">100.64.9.133</text>
                    <text x="42" y="344">100.64.31.88</text>
                    <text x="592" y="302" text-anchor="end">177.137.21.32</text>
                </g>
                <text class="topology__label-hot" x="42" y="134">100.64.18.210</text>
                <text class="topology__label-hot" x="592" y="104" text-anchor="end">177.137.21.8:39936</text>
            </svg>
        </section>

        <section class="auth_card" aria-labelledby="loginTitle">
            <h1 id="loginTitle" class="auth_card__title">Acesso ao sistema</h1>

            <div id="loginMessage" class="auth_message" hidden role="alert"></div>

            <form class="auth_form" id="loginForm" novalidate>
                <div class="field">
                    <label for="username">Usuário</label>
                    <div class="input_shell">
                        <span class="input_shell__prompt" aria-hidden="true">&gt;</span>
                        <input type="text" id="username" name="username" autocomplete="username" placeholder="seu.login" required>
                    </div>
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <div class="input_shell">
                        <span class="input_shell__prompt" aria-hidden="true">&gt;</span>
                        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
                        <button type="button" class="input_shell__toggle" id="togglePassword" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button>
                    </div>
                </div>
                <button type="submit" class="cta_button cta_button--block" id="btnLogin">
                    Entrar
                    <span aria-hidden="true">→</span>
                </button>
            </form>

            <p class="auth_card__note">Acesso restrito à equipe autorizada. Sem acesso? Solicite ao administrador.</p>
        </section>
    </main>

    <footer class="site_footer">
        <p>© 2025 Interativa Fibra &amp; Energia Ltda. · CNPJ 38.174.307/0001-81</p>
        <p>PLog v2.0</p>
    </footer>

    <script src="/script.js?v=7"></script>
</body>
</html>
