<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>try{if(localStorage.getItem('plog_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
    <title>PLog</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/style.css?v=1">
</head>
<body class="body_index">
    <header class="site_header_index">
        <nav class="nav_index">
            <a href="/" class="nav_index__brand">PLOG</a>
            <button id="themeToggle" class="theme_toggle" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema claro/escuro">
                <svg class="theme_toggle__moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg class="theme_toggle__sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            </button>
        </nav>
    </header>
    <main class="main_index">
        <section class="hero_index">
            <div class="hero_index__glow" aria-hidden="true"></div>

            <div class="hero_index__card">
                <span class="logo_ring logo_ring--outer" aria-hidden="true"></span>
                <span class="logo_ring logo_ring--inner" aria-hidden="true"></span>
                <span class="logo_orbit" aria-hidden="true"><span class="logo_orbit__dot"></span></span>
                <span class="logo_orbit logo_orbit--alt" aria-hidden="true"><span class="logo_orbit__dot"></span></span>
                <span class="logo_pulse" aria-hidden="true"></span>
                <img src="/img/logo.png" alt="Logo PLog" class="logo_index">
            </div>

            <p class="hero_index__eyebrow">Análise de flows de rede</p>
            <p class="hero_index__subtitle">Consulta estruturada de logs com filtros por data, IP e porta.</p>

              <a href="login.html" class="hero_index__cta hero_index__cta--v3">
                Acessar sistema
                <span class="hero_index__cta-arrow" aria-hidden="true">→</span>
              </a>
        </section>
    </main>
    <footer id="rodape_index" class="footer_index">
        <div class="footer_index__inner">
            <div class="footer_index__brand">
                <span class="footer_index__logo">PLOG</span>
                <span class="footer_index__tag">Network Flow Analytics</span>
            </div>
            <p class="footer_index__copy">
                ©2025 Interativa Fibra &amp; Energia Ltda.
                <span id="span_rodape">Todos os direitos reservados. CNPJ 38.174.307/0001-81</span>
            </p>
            <span class="footer_index__meta">v2.0 · Itallo Polito</span>
        </div>
    </footer>
    <script src="/script.js?v=1"></script>
</body>
</html>
